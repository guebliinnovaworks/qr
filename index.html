<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guebli Innova Works</title>
    <meta name="description" content="Guebli Innova Works: find us on Facebook, Instagram, by phone and on the map.">
    <meta name="theme-color" content="#f7f7f7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f7f7;
            --ink: #1c1c1f;
            --muted: #5d5d66;
            --orange: #ff5a00;
            --amber: #ffa200;
            --chrome: linear-gradient(135deg, #ffffff 0%, #c9ccd1 28%, #f4f5f7 50%, #9ea3ab 74%, #e9ebee 100%);
            --tile: linear-gradient(145deg, #ffb300 0%, #ff6a00 55%, #d93a00 100%);
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: "Saira", "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(60% 40% at 50% 0%, rgba(255, 140, 0, .14), transparent 70%),
                var(--bg);
            display: flex;
            justify-content: center;
            padding: 32px 20px 40px;
        }

        main {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: min(100%, 360px);
            height: auto;
            display: block;
            mix-blend-mode: multiply;
        }

        .tagline {
            margin-top: 6px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: .04em;
            color: var(--muted);
            text-align: center;
        }

        .links {
            list-style: none;
            padding: 0;
            width: 100%;
            margin-top: 28px;
            display: grid;
            gap: 14px;
        }

        /* Chrome border, white face */
        .link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 2px;
            border-radius: 18px;
            background: var(--chrome);
            text-decoration: none;
            color: inherit;
            box-shadow: 0 6px 16px rgba(40, 40, 50, .12), 0 1px 0 rgba(255, 255, 255, .9) inset;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .link-inner {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px 14px 14px;
            border-radius: 16px;
            background: linear-gradient(180deg, #ffffff, #f1f2f4);
        }

        .icon {
            flex: none;
            width: 52px;
            height: 52px;
            filter: drop-shadow(0 3px 5px rgba(30, 30, 40, .22));
        }

        .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .sub {
            font-size: .95rem;
            font-weight: 500;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .chev {
            margin-left: auto;
            flex: none;
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--orange);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(255, 90, 0, .22), 0 1px 0 rgba(255, 255, 255, .9) inset;
        }

        .link:active {
            transform: translateY(0) scale(.99);
        }

        .link:focus-visible {
            outline: 3px solid var(--orange);
            outline-offset: 3px;
        }

        footer {
            margin-top: 32px;
            font-size: .85rem;
            font-weight: 500;
            color: var(--muted);
            text-align: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .link {
                transition: none;
            }

            .link:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <img class="logo" src="guebli.jpeg" alt="Guebli Innova Works logo" width="1536" height="1024">
        <p class="tagline">Contactez-nous par l'un de ces moyens</p>

        <ul class="links">
            <li>
                <a class="link" href="https://www.facebook.com/share/1E8GxVSkVu/" target="_blank"
                    rel="noopener noreferrer">
                    <span class="link-inner">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path fill="#1877F2"
                                    d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                            </svg>
                        </span>
                        <span class="text">

                        </span>
                        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 6l6 6-6 6" />
                        </svg>

            </li>

            <li>

                    <span class="link-inner">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 48 48">
                                <defs>
                                    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
                                        <stop offset="0" stop-color="#FEDA77" />

                                        <stop offset=".5" stop-color="#DD2A7B" />
                                        <stop offset=".75" stop-color="#8134AF" />
                                        <stop offset="1" stop-color="#515BD4" />
                                    </linearGradient>

                        </span>
                        <span class="text">
                            <span class="title">Instagram</span>

                            <path d="M9 6l6 6-6 6" />

                    </span>

            </li>

            <li>
                <a class="link" href="tel:+213561630051">

                        <span class="icon" aria-hidden="true">

                                <rect width="48" height="48" rx="13" fill="#34C759" />
                                <g transform="translate(11 11) scale(1.1)" fill="none" stroke="#fff" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path

                                </g>
                            </svg>
                        </span>
                        <span class="text">
                            <span class="title">Appelez-nous</span>
                            <span class="sub" dir="ltr">+213 561 63 00 51</span>
                        </span>
                        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 6l6 6-6 6" />
                        </svg>
                    </span>

            <li>
                <a class="link" href="https://maps.app.goo.gl/6RPgjUTy4WvUFKU87" target="_blank"

                    <span class="link-inner">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 48 48">
                                <rect width="48" height="48" rx="13" fill="#fff" stroke="#dadce0" stroke-width="1.5" />
                                <path

                                    fill="#EA4335" />
                                <circle cx="24" cy="18.500" r="4.800" fill="#fff" />
                            </svg>
                        </span>
                        <span class="text">
                            <span class="title">Retrouver-nous</span>
                            <span class="sub">Ouvrir dans Google Maps</span>
                        </span>
                        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 6l6 6-6 6" />
                        </svg>
                    </span>
                </a>
            </li>
        </ul>

        <footer>&copy; <span id="y">2026</span> Guebli Innova Works</footer>
    </main>

    <script>
        document.getElementById("y").textContent = new Date().getFullYear();
    </script>
</body>

</html>
